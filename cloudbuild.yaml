steps:
- name: 'gcr.io/cloud-builders/docker'
  id: Build-Image
  args: 
    - 'build'
    - '-t'
    - 'gcr.io/$PROJECT_ID/github.com/exauceh/gcpu_hackathon:$COMMIT_SHA'
    - '.'

# Spécifiez le bucket des logs ici
logsBucket: 'gs://gcpu-hackathon-2025-474123'

images:
- 'gcr.io/$PROJECT_ID/github.com/exauceh/gcpu_hackathon:$COMMIT_SHA'

# Raccordez votre build au compte de service que vous avez spécifié
# dans le déclencheur (gcpu-hackathon@...)
options:
  serviceAccount: 'p