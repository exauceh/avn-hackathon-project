steps:
  # Build API Gateway
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/api-gateway:$SHORT_SHA'
      - '-f'
      - 'cloud/services/api-gateway/Dockerfile'
      - '.'
    id: 'build-api-gateway'

  # Build Agents
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/agents:$SHORT_SHA'
      - '-f'
      - 'core/agents/Dockerfile'
      - '.'
    id: 'build-agents'

  # Push images
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/api-gateway:$SHORT_SHA']
    waitFor: ['build-api-gateway']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/agents:$SHORT_SHA']
    waitFor: ['build-agents']

  # Deploy API Gateway
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'api-gateway'
      - '--image=gcr.io/$PROJECT_ID/api-gateway:$SHORT_SHA'
      - '--region=europe-west9'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=GCP_PROJECT_ID=$PROJECT_ID'
      - '--max-instances=10'
      - '--memory=2Gi'
      - '--timeout=300'
    waitFor: ['build-api-gateway']

  # Deploy Agents
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'agents'
      - '--image=gcr.io/$PROJECT_ID/agents:$SHORT_SHA'
      - '--region=europe-west9'
      - '--platform=managed'
      - '--no-allow-unauthenticated'
      - '--set-env-vars=GCP_PROJECT_ID=$PROJECT_ID'
      - '--set-secrets=GOOGLE_API_KEY=gemini-api-key:latest'
      - '--max-instances=5'
      - '--memory=4Gi'
      - '--timeout=600'
      - '--cpu=2'
    waitFor: ['build-agents']

images:
  - 'gcr.io/$PROJECT_ID/api-gateway:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/agents:$SHORT_SHA'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY