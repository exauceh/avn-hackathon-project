steps:
- name: 'gcr.io/cloud-builders/docker' # C'est un builder standard, on le laisse
  id: Build-Image
  args: 
    - 'build'
    - '-t'
    - 'europe-west9-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/gcpu_hackathon:$COMMIT_SHA' # <-- 1. CHANGEMENT ICI
    - '.'

# ÉTAPE AJOUTÉE : Déploiement sur Cloud Run
- name: 'us-central1-docker.pkg.dev/cloud-sdk/cloud-sdk/gcloud'
  args:
    - gcloud
    - run
    - deploy
    - gcpu-hackathon-2025
    - --image
    - 'europe-west9-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/gcpu_hackathon:$COMMIT_SHA' # <-- 2. CHANGEMENT ICI
    - --region
    - europe-west9
    - --platform
    - managed

logsBucket: 'gs://gcpu-hackathon-logs-474123' 

images:
- 'europe-west9-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/gcpu_hackathon:$COMMIT_SHA' # <-- 3. CHANGEMENT ICI