steps:
- name: 'gcr.io/cloud-builders/docker'
  id: Build-Image
  args:
    - 'build'
    - '-t'
    - 'europe-west9-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/gcpu_hackathon:$COMMIT_SHA'
    - '.'

- name: 'gcr.io/cloud-builders/docker'
  id: Push-Image
  args:
    - 'push'
    - 'europe-west9-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/gcpu_hackathon:$COMMIT_SHA'

- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  args:
    - gcloud
    - run
    - deploy
    - gcpu-hackathon-2025
    - --image
    - 'europe-west9-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/gcpu_hackathon:$COMMIT_SHA'
    - --region
    - europe-west9
    - --platform
    - managed


logsBucket: 'gs://gcpu-hackathon-logs-474123' 

images:
- 'europe-west9-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/gcpu_hackathon:$COMMIT_SHA' # <-- 3. CHANGEMENT ICI